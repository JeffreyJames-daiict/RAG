[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Production-grade enterprise RAG pipeline with modular connectors, parser, and vector database ingestion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "boto3>=1.30.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
